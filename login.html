<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Login — PhotoWave</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><a href="index.html">← Back</a><span>PHOTOWAVE DEMO</span></header>
<main class="shell login-shell">
  <div class="photo-logo"><span class="camera-icon">◎</span><strong>PhotoWave</strong></div>
  <p class="muted">Sign in to continue the demo</p>
  <div class="demo-notice">This is a fictional login interface. Use only the sample credentials shown below. Never enter a real password.</div>
  <form id="demo-login" class="form-card">
    <label for="username">Demo username</label><input id="username" name="username" autocomplete="off" placeholder="demo_user" required>
    <label for="password">Demo passcode</label><input id="password" name="password" type="password" autocomplete="off" placeholder="demo123" required>
    <button class="button" type="submit">Continue</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
  <p class="credentials">Sample username: <b>demo_user</b><br>Sample passcode: <b>demo123</b></p>
  <a class="text-link" href="info.html">Why is this a demo?</a>
</main><script src="js/script.js"></script></body></html>
