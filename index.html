<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Card Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #d3d6d7;
    font-family: Arial, sans-serif;
}

.phone {
    width: 100%;
    max-width: 484px;
    min-height: 100vh;
    margin: auto;
    background: #f5eeee;
    position: relative;
    padding-bottom: 70px;
}

/* Orange Search Bar */

.topbar {
    height: 73px;
    background: #f58b00;
    display: flex;
    align-items: center;
    padding: 10px 18px;
    gap: 12px;
    border-bottom: 4px solid #a4008b;
}

.back {
    color: white;
    font-size: 27px;
}

.search {
    background: white;
    height: 47px;
    flex: 1;
    border-radius: 12px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    color: #777;
    font-size: 15px;
}

/* Gift Card Heading */

.content {
    padding: 16px 20px;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 17px;
    border-bottom: 1px solid #ddd;
}

.brand {
    font-size: 25px;
    font-weight: bold;
    color: #252525;
    letter-spacing: -1px;
}

.subtitle {
    color: #555;
    margin-top: 7px;
    font-size: 17px;
}

.price {
    font-size: 29px;
    font-weight: bold;
}

/* Orange Gift Card */

.gift-card {
    margin-top: 23px;
    height: 272px;
    background: #ed5900;
    border-radius: 24px;
    border: 6px solid #fff;
    box-shadow: 0 4px 12px #bbb;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.amazon-arrow {
    color: white;
    font-size: 85px;
    font-weight: bold;
    z-index: 1;
}

.card-label {
    position: absolute;
    bottom: 15px;
    right: 18px;
    color: white;
    text-align: right;
    font-size: 13px;
    font-weight: bold;
}

.demo-label {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    color: #a33b00;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
}

/* Button */

.redeem {
    margin-top: 27px;
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 35px;
    background: #ffd000;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px #ccc;
}

/* Bottom Navigation */

.bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 484px;
    height: 64px;
    background: #f8f8f8;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.nav-item {
    text-align: center;
    color: #666;
    font-size: 12px;
}

.nav-icon {
    font-size: 23px;
    display: block;
    margin-bottom: 3px;
}

.active {
    color: #167b8b;
}

@media (min-width: 600px) {
    .phone {
        min-height: 100vh;
    }
}
</style>
</head>

<body>

<div class="phone">

    <div class="topbar">
        <span class="back">‹</span>
        <div class="search">
            🔍 &nbsp; Search or ask a question...
            &nbsp; 📷
        </div>
        <span>🎙</span>
    </div>

    <div class="content">

        <div class="heading">
            <div>
                <div class="brand">amazon pay</div>
                <div class="subtitle">gift card</div>
            </div>

            <div class="price">₹500</div>
        </div>

        <div class="gift-card">

            <div class="demo-label">DEMO CARD</div>

            <div class="amazon-arrow">⌣➜</div>

            <div class="card-label">
                amazon pay<br>
                gift card
            </div>

        </div>

        <button class="redeem" onclick="demoMessage()">
            Redeem Gift Card
        </button>

    </div>

    <div class="bottom-nav">

        <div class="nav-item">
            <span class="nav-icon">⌂</span>
            Home
        </div>

        <div class="nav-item">
            <span class="nav-icon">♙</span>
            You
        </div>

        <div class="nav-item active">
            <span class="nav-icon">▣</span>
            Wallet
        </div>

        <div class="nav-item">
            <span class="nav-icon">🛒</span>
            Cart
        </div>

        <div class="nav-item">
            <span class="nav-icon">☰</span>
            Browse
        </div>

        <div class="nav-item">
            <span class="nav-icon">☻</span>
            Profile
        </div>

    </div>

</div>

<script>
function demoMessage() {
    alert("This is a demonstration gift card. It cannot be redeemed.");
}
</script>

</body>
</html>
